{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-5">
        <h2>Hospital Management System</h2>
        <h5 class="text-muted">Welcome {{ name }}</h5>
    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow text-center h-100">
                <div class="card-body">
                    <h1>👤</h1>
                    <h5>Patients</h5>
                    <a href="{% url 'add_patient' %}" class="btn btn-success btn-sm m-1">Add</a>
                    <a href="{% url 'view_patient' %}" class="btn btn-primary btn-sm m-1">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center h-100">
                <div class="card-body">
                    <h1>👨‍⚕️</h1>
                    <h5>Doctors</h5>
                    <a href="{% url 'add_doctor' %}" class="btn btn-success btn-sm m-1">Add</a>
                    <a href="{% url 'view_doctor' %}" class="btn btn-primary btn-sm m-1">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center h-100">
                <div class="card-body">
                    <h1>📅</h1>
                    <h5>Appointments</h5>
                    <a href="{% url 'add_appointment' %}" class="btn btn-success btn-sm m-1">Book</a>
                    <a href="{% url 'view_appointment' %}" class="btn btn-primary btn-sm m-1">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center h-100">
                <div class="card-body">
                    <h1>💊</h1>
                    <h5>Pharmacy</h5>
                    <a href="{% url 'add_medicine' %}" class="btn btn-success btn-sm m-1">Add</a>
                    <a href="{% url 'view_medicine' %}" class="btn btn-primary btn-sm m-1">View</a>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a href="{% url 'logout' %}" class="btn btn-danger">
            Logout
        </a>
    </div>

</div>

{% endblock %}
