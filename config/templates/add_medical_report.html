{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        <i class="bi bi-file-earmark-medical-fill text-primary"></i>
        Upload Medical Report
    </h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Upload Report
        </button>

    </form>

</div>

{% endblock %}
