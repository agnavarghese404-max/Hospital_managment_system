{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        <i class="bi bi-receipt-cutoff text-success"></i>
        Add Billing
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save Bill
        </button>

        <a href="{% url 'home' %}" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
