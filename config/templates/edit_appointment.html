{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Edit Appointment</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Update Appointment
        </button>

        <a href="{% url 'view_appointment' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
